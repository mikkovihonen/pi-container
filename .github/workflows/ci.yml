name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Cache uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --frozen --project . --all-groups

      - name: Install pre-commit
        run: uv tool install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Validate version consistency
        run: uv run python3 .github/workflows/scripts/validate_versions.py

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Cache uv cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --frozen --project . --all-groups

      - name: Run tests with coverage
        run: uv run --group src --group proxy pytest --cov --cov-report=xml --cov-report=term-missing

      - name: Generate coverage badge
        run: uv run python3 .github/workflows/scripts/generate_coverage_badge.py

      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add -f docs/assets/
          git diff --cached --quiet || git commit -m 'Update coverage badge'
          git push

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [check, test]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # The release body is the CHANGELOG section for this version; GitHub's
      # generated notes (the "What's Changed" PR list) are appended below it.
      # An empty extract is fatal — otherwise a heading that does not match the
      # tag ships an auto-notes-only release with no signal that it happened.
      - name: Extract CHANGELOG section
        run: |
          awk -v v="${{ steps.version.outputs.VERSION }}" '
            $0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { p = 1; next }
            p && /^## / { exit }
            p
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::No '## [${{ steps.version.outputs.VERSION }}]' section in CHANGELOG.md"
            exit 1
          fi
          cat "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Release ${{ steps.version.outputs.VERSION }}"
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: false
