extends: existence
message: "Use no more than three nouns in a row."
level: suggestion
scope: sentence
# ASD-STE100 Rule 2.1: Multi-word nouns should not exceed three nouns.
tokens:
  - '\b\w+(?:\s+\w+){2,}(?:\s+\w+)\b'
ignorecase: true
exceptions:
  - "the quick brown fox"
  - "a quick brown fox"
  - "to the quick brown fox"
