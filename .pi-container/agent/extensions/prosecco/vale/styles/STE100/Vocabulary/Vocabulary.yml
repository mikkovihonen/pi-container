extends: substitution
message: "Use '%s' instead of '%s'."
level: suggestion
ignorecase: false
swap:
  # From List of recurring errors (Part 2, Section 0)
  acceptable: "permitted"
  alternate: "alternative"
  avoid: "prevent"
  both: "the two"
  ensure: "make sure"
  fit: "install"
  follow: "obey"
  further: "more"
  have to: "use an action verb"
  however: "but"
  insert: "put"
  main: "primary"
  may: "can"
  need: "necessary"
  old: "remaining"
  over: "above"
  people: "person"
  perform: "do"
  portion: "part"
  press: "push"
  reach: "get"
  repeat: "do"
  required: "necessary"
  rotate: "turn"
  shall: "must"
  should: "must"
  since: "because"
  test: "test"
  therefore: "thus"
  under: "below"
  using: "use"
  # Additional forbidden words
  initiate: "start"
  commence: "start"
  utilize: "use"
  facilitate: "help"
  implement: "do"
  accomplish: "do"
