extends: existence
message: "Use the active voice."
level: suggestion
scope: sentence
tokens:
  - '\b(is|are|was|were|be|been|being)\s+\w+(ed|en)\b'
ignorecase: true
exceptions:
  - is here
  - is there
  - is where
  - is when
  - is who
  - is why
  - is how
  - was here
  - was there
  - are here
  - are there
