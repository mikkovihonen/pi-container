# Only permit Python package servers (pypi.org / files.pythonhosted.org),
# npm package registries, and Debian/Ubuntu apt infrastructure. All other
# traffic is blocked by default.
global:
  mode: "allow"
  default_action: "block"
  status_code: 403
  rules:
    - name: "pypi-org-allow"
      mode: "allow"
      hostnames:
        - "pypi.org"
        - "*.pypi.org"
      ip_ranges: []

    - name: "pythonhosted-org-allow"
      mode: "allow"
      hostnames:
        - "files.pythonhosted.org"
        - "*.files.pythonhosted.org"
      ip_ranges: []

    - name: "npm-registry-allow"
      mode: "allow"
      hostnames:
        - "registry.npmjs.org"
        - "*.registry.npmjs.org"
        - "*.npmjs.org"
      ip_ranges: []

    - name: "github-allow"
      mode: "allow"
      hostnames:
        - "github.com"
        - "ghcr.io"
        - "api.github.com"
        - "codeload.github.com"
        - "objects.githubusercontent.com"
        - "collector.github.com"
        - "*.github.com"
        - "*.githubassets.com"
        - "*.githubusercontent.com"
      ip_ranges: []

    - name: "yarn-registry-allow"
      mode: "allow"
      hostnames:
        - "registry.yarnpkg.com"
        - "*.yarnpkg.com"
      ip_ranges: []

    - name: "debian-apt-allow"
      mode: "allow"
      hostnames:
        - "debian.map.fastlydns.net"
        - "deb.debian.org"
        - "*.deb.debian.org"
        - "security.debian.org"
        - "*.security.debian.org"
        - "packages.debian.org"
        - "*.packages.debian.org"
      ip_ranges: []

    - name: "opper-ai-allow"
      mode: "allow"
      hostnames:
        - "api.opper.ai"
      ip_ranges: []

    # Toolchain and language runtime upstream sources (for upgrade-toolchains skill)
    - name: "go-dev-allow"
      mode: "allow"
      hostnames:
        - "go.dev"
        - "*.go.dev"
        - "golang.org"
        - "*.golang.org"
      ip_ranges: []

    - name: "rust-lang-allow"
      mode: "allow"
      hostnames:
        - "rust-lang.org"
        - "*.rust-lang.org"
        - "static.rust-lang.org"
      ip_ranges: []

    - name: "nodejs-org-allow"
      mode: "allow"
      hostnames:
        - "nodejs.org"
        - "*.nodejs.org"
      ip_ranges: []

    - name: "kernel-org-allow"
      mode: "allow"
      hostnames:
        - "kernel.org"
        - "*.kernel.org"
        - "mirrors.edge.kernel.org"
      ip_ranges: []

    - name: "ruby-lang-allow"
      mode: "allow"
      hostnames:
        - "ruby-lang.org"
        - "*.ruby-lang.org"
        - "www.ruby-lang.org"
        - "cache.ruby-lang.org"
      ip_ranges: []

    - name: "ziglang-org-allow"
      mode: "allow"
      hostnames:
        - "ziglang.org"
        - "*.ziglang.org"
      ip_ranges: []

    - name: "python-org-allow"
      mode: "allow"
      hostnames:
        - "python.org"
        - "*.python.org"
        - "www.python.org"
      ip_ranges: []

    # T3 Code (t3.codes) web app and release endpoints
    - name: "t3-codes-allow"
      mode: "allow"
      hostnames:
        - "t3.codes"
        - "*.t3.codes"
        - "ping.gg"
        - "*.ping.gg"
      ip_ranges: []

    # Source control providers supported by T3 Code
    - name: "gitlab-source-control-allow"
      mode: "allow"
      hostnames:
        - "gitlab.com"
        - "*.gitlab.com"
      ip_ranges: []

    - name: "forgejo-gitea-source-control-allow"
      mode: "allow"
      hostnames:
        - "codeberg.org"
        - "*.codeberg.org"
        - "gitea.com"
        - "*.gitea.com"
        - "forgejo.org"
        - "*.forgejo.org"
      ip_ranges: []

    - name: "bitbucket-source-control-allow"
      mode: "allow"
      hostnames:
        - "bitbucket.org"
        - "*.bitbucket.org"
        - "api.bitbucket.org"
        - "auth.atlassian.com"
        - "id.atlassian.com"
        - "*.atlassian.com"
      ip_ranges: []

    - name: "azure-devops-source-control-allow"
      mode: "allow"
      hostnames:
        - "dev.azure.com"
        - "*.dev.azure.com"
        - "*.visualstudio.com"
        - "login.microsoftonline.com"
        - "management.azure.com"
      ip_ranges: []

    - name: "gitcafe-source-control-allow"
      mode: "allow"
      hostnames:
        - "git.cafe"
        - "*.git.cafe"
        - "api.git.cafe"
      ip_ranges: []
