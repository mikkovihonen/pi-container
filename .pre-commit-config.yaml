repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --project . ruff check --fix
        language: system
        types: [python]
        pass_filenames: false
        always_run: false

      - id: ruff-format
        name: ruff-format
        entry: uv run --project . ruff format --check
        language: system
        types: [python]
        pass_filenames: false
        always_run: false

      - id: pytest
        name: pytest
        entry: uv run --project . --group src --group proxy pytest
        language: system
        types: [python]
        pass_filenames: false

      - id: format-markdown
        name: format-markdown
        entry: uv run --project . python3 scripts/format_markdown.py
        language: system
        types: [markdown]
        pass_filenames: true

      - id: pymarkdown
        name: pymarkdown
        entry: uv run --project . pymarkdown --config .pymarkdown.json scan
        language: system
        types: [markdown]
        pass_filenames: true


