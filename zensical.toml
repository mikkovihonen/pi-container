[project]
site_name = "pi-container"
site_description = "A containerized environment for running the pi-coding-agent with local LLM inference and full auditability"
site_url = "https://mikkovihonen.github.io/pi-container"

repo_name = "mikkovihonen/pi-container"
repo_url = "https://github.com/mikkovihonen/pi-container"

nav = [
  { "Home" = "index.md" },
  { "Getting Started" = "getting-started.md" },
  { "Sandboxing 101" = "sandboxing.md" },
  { "Architecture" = "architecture.md" },
  { "Design details" = "design-details.md" },
  { "Configuration" = "configuration.md" },
  { "Development" = "development.md" },
  { "Releases" = "releases.md" },
  { "Proxy & addons" = [
    { "Overview" = "proxy/overview.md" },
    { "Allowlist" = "proxy/allowlist.md" },
    { "Token Replacer" = "proxy/token-replacer.md" },
    { "Flow Export" = "proxy/flow-export.md" },
    { "Addon Development" = "proxy/addon-development.md" },
  ] },
]

[project.theme]
language = "en"
logo = "assets/pi-container-logo.svg"
favicon = "assets/png/pi-container-32.png"
custom_dir = "docs/overrides"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}

