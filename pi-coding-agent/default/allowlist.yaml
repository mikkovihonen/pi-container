# Only permit Python package servers (pypi.org / files.pythonhosted.org),
# npm package registries, and Debian/Ubuntu apt infrastructure. All other
# traffic is blocked by default.
global:
  mode: "allow"
  default_action: "block"
  status_code: 403
  rules:
    - name: "pypi-org-allow"
      mode: "allow"
      hostnames:
        - "pypi.org"
        - "*.pypi.org"
      ip_ranges: []

    - name: "pythonhosted-org-allow"
      mode: "allow"
      hostnames:
        - "files.pythonhosted.org"
        - "*.files.pythonhosted.org"
      ip_ranges: []

    - name: "npm-registry-allow"
      mode: "allow"
      hostnames:
        - "registry.npmjs.org"
        - "*.registry.npmjs.org"
        - "*.npmjs.org"
      ip_ranges: []

    - name: "github-allow"
      mode: "allow"
      hostnames:
        - "github.com"
        - "api.github.com"
        - "codeload.github.com"
        - "objects.githubusercontent.com"
        - "collector.github.com"
        - "*.github.com"
        - "*.githubassets.com"
        - "*.githubusercontent.com"
      ip_ranges: []

    - name: "yarn-registry-allow"
      mode: "allow"
      hostnames:
        - "registry.yarnpkg.com"
        - "*.yarnpkg.com"
      ip_ranges: []

    # Uncomment when nested_containers.enabled = true. Registry pulls are HTTPS and
    # are inspected by mitmproxy like any other traffic.
    # - name: "container-registries-allow"
    #   mode: "allow"
    #   hostnames:
    #     - "registry-1.docker.io"
    #     - "auth.docker.io"
    #     # Docker Hub 307-redirects layer blobs to a CDN on docker.com, which
    #     # "*.docker.io" does not cover. Without these, auth and manifest
    #     # resolve and the pull then dies on the first layer with a 403.
    #     - "production.cloudfront.docker.com"
    #     - "*.cloudfront.docker.com"
    #     - "production.cloudflare.docker.com"
    #     - "*.docker.io"
    #     - "ghcr.io"
    #     - "*.ghcr.io"
    #     - "pkg-containers.githubusercontent.com"
    #     - "quay.io"
    #     - "*.quay.io"
    #     - "gcr.io"
    #     - "*.gcr.io"
    #   ip_ranges: []

    - name: "debian-apt-allow"
      mode: "allow"
      hostnames:
        - "debian.map.fastlydns.net"
        - "deb.debian.org"
        - "*.deb.debian.org"
        - "security.debian.org"
        - "*.security.debian.org"
        - "packages.debian.org"
        - "*.packages.debian.org"
      ip_ranges: []

    # Toolchain and language runtime upstream sources (for upgrade-toolchains skill)
    - name: "go-dev-allow"
      mode: "allow"
      hostnames:
        - "go.dev"
        - "*.go.dev"
        - "golang.org"
        - "*.golang.org"
      ip_ranges: []

    - name: "rust-lang-allow"
      mode: "allow"
      hostnames:
        - "rust-lang.org"
        - "*.rust-lang.org"
        - "static.rust-lang.org"
      ip_ranges: []

    - name: "nodejs-org-allow"
      mode: "allow"
      hostnames:
        - "nodejs.org"
        - "*.nodejs.org"
      ip_ranges: []

    - name: "kernel-org-allow"
      mode: "allow"
      hostnames:
        - "kernel.org"
        - "*.kernel.org"
        - "mirrors.edge.kernel.org"
      ip_ranges: []

    - name: "ruby-lang-allow"
      mode: "allow"
      hostnames:
        - "ruby-lang.org"
        - "*.ruby-lang.org"
        - "www.ruby-lang.org"
        - "cache.ruby-lang.org"
      ip_ranges: []

    - name: "ziglang-org-allow"
      mode: "allow"
      hostnames:
        - "ziglang.org"
        - "*.ziglang.org"
      ip_ranges: []

    - name: "python-org-allow"
      mode: "allow"
      hostnames:
        - "python.org"
        - "*.python.org"
        - "www.python.org"
      ip_ranges: []
